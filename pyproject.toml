[project]
name = "le-wm"
version = "0.1.0"
description = "LeWorldModel (LeWM) training and evaluation scripts"
readme = "README.md"
requires-python = "==3.10.18"
dependencies = [
    "h5py>=3.16.0",
    "hdf5plugin>=7.1.0",
    "huggingface-hub>=0.34,<1.0",
    "stable-pretraining==0.1.8",
    "stable-worldmodel[all,env,format,train]",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false

[tool.uv.sources]
stable-worldmodel = { git = "https://github.com/galilai-group/stable-worldmodel", rev = "10c26dbd5677083fa31dba69eb738b973845e9a4" }
