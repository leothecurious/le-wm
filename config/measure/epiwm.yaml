# EpiWM's probe sampling (worldmodel/analysis/probes.py): 2400 random 6-frame
# clips, encoded in bf16, rolled out from one frame
defaults:
  - pusht
  - _self_

data:
  sampler: random_clips
  n: 2400
  seed: 77

rollout:
  context: 1
  max_horizon: 5
  precision: bf16

metrics:
  - {name: rank_spectrum, frame: 0}
  - {name: goal_rank, length: 6}

output:
  filename: pusht_epiwm.txt
