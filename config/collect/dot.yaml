# Moving-dot sequences after Sobal et al. (2022, arXiv 2211.10831), App. A.2.
# Lengths are in units of the square's side. Geometry follows the reference code (vladisai/JEPA_SSL_NeurIPS_2022,
# data/single.py) where it differs from the paper's text: its pixel values on a 28-px frame divided by 27, the
# span of its pixel coordinates.
defaults:
  - _self_
  - optional /paths: local

paths:
  data: null # root holding datasets/; null = STABLEWM_HOME or ~/.stable_worldmodel

name: dot_train.h5 # written to <paths.data>/datasets/
episodes: 10000
seed: 0
size: 32 # frame side in pixels; 28 in the paper, 32 here so the decoder's doublings reach it
steps: 16 # actions per episode; an episode has steps + 1 frames
max_step: 0.148148 # largest action norm; 4 px in the code (paper: 0.14)
sigma: 0.048148 # Gaussian blur of the dot; 1.3 px in the code (paper: 0.05)
margin: 0.096296 # the dot starts and stays at least 2 sigma from every edge, as in the code (paper: clipped to [0, 1])
concentration: 0.2 # Von Mises concentration of action directions around the episode's heading (paper: 1.3)
chunk: 1000 # episodes generated at once
