# Moving-dot sequences after Sobal et al. (2022, arXiv 2211.10831), App. A.2.
# Lengths are in units of the square's side.
name: dot.h5 # written to $STABLEWM_HOME/datasets/
episodes: 10000
seed: 0
size: 32 # frame side in pixels; 28 in the paper, 32 here so the decoder's doublings reach it
steps: 16 # actions per episode; an episode has steps + 1 frames
max_step: 0.14 # largest action norm
sigma: 0.05 # Gaussian blur of the dot
concentration: 1.3 # Von Mises concentration of action directions around the episode's heading
chunk: 1000 # episodes generated at once
