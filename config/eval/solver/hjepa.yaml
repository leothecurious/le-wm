# Push-T planner of H-JEPA (pusht_l2): level 2 plans latent actions, level 1 the real ones.
_target_: hjepa_planner.HierarchicalSolver
_recursive_: false
model: ???
eval_budget: ${eval.eval_budget}
plan:
  receding_horizon: ${plan_config.receding_horizon}
  level1:
    horizon: ${plan_config.horizon}
    pre_decay_horizon: 2
    action_block: ${plan_config.action_block}
    cost_last_n: 2
    action_cost_weight: 0.2
  level2:
    horizon: 8
    action_dim: 4
    cost_last_n: 1
solvers:
  level1:
    _target_: hjepa_planner.GradientSolver
    n_steps: 90
    batch_size: 1
    var_scale: 1.0
    num_samples: 50
    action_noise: 0
    device: cuda
    seed: ${seed}
    optimizer_cls:
      _target_: hydra.utils.get_class
      path: torch.optim.AdamW
    optimizer_kwargs:
      lr: 0.1
  level2:
    _target_: hjepa_planner.GradientSolver
    n_steps: 90
    batch_size: 1
    var_scale: 1.0
    num_samples: 400
    action_noise: 0.01
    device: cuda
    seed: ${seed}
    optimizer_cls:
      _target_: hydra.utils.get_class
      path: torch.optim.AdamW
    optimizer_kwargs:
      lr: 0.075
