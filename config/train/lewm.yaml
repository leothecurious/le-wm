defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${output_model_name}

num_workers: 3
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 10
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  deterministic: True

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 1
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

# coloured corner square, mode off | episode | frame (see tag.py)
tag:
  mode: "off"
  size: 5
  seed: ${seed}

# pair cosines of n tagged frames, logged every this many steps (null = off)
pair:
  every_n_steps: null
  n: 256

# also save weights_step_N.pt every this many optimizer steps (null = epochs only)
checkpoint:
  every_n_steps: null

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
