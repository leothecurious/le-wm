# @package _global_
# Moving dot from collect_dot.py, at its recorded size: 4-pixel ViT patches make an 8x8 grid
# and the pixel objectives decode to the full frame.
data:
  dataset:
    num_steps: ${eval:'${num_preds} + ${history_size}'}
    frameskip: 1
    name: dot_train.h5
    keys_to_load:
      - pixels
      - action
    keys_to_cache:
      - action
split_unit: episodes
history_size: 1
img_size: 32
patch_size: 4
decoder_size: 32
output_model_name: dot_${loss.kind}_${noise.mode}${noise.alpha}_seed${seed}
